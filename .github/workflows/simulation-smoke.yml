name: CEREBRON deterministic domain smoke
on:
  push:
    paths: ["worker/**", ".github/workflows/simulation-smoke.yml"]
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python worker/smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: simulation-smoke-artifact
          path: artifacts/smoke-result.json
